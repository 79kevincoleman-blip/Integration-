name: Alpaca paper bridge
on:
  push:
    branches: [claude/webull-paper-trading-lvj9ad]
    paths: [alpaca/request.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alpaca/bridge.py alpaca/request.json
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.ALPACA_SECRET || secrets.ALPACA_SECRET_KEY_ID }}
